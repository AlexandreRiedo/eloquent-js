    <!-- Exercice 1 -->
    <script>
        let $p1 = document.getElementById("ex-1");
        let text1 = "";

        // Fill in the regular expressions
        verify(/ca[rt]/,
            ["my car", "bad cats"],
            ["camper", "high art"]);

        verify(/pr?op/,
            ["pop culture", "mad props"],
            ["plop", "prrrop"]);

        verify(/ferr(et|y|ari)/,
            ["ferret", "ferry", "ferrari"],
            ["ferrum", "transfer A"]);

        verify(/ious\b/,
            ["how delicious", "spacious room"],
            ["ruinous", "consciousness"]);

        verify(/\s[.,;:]/,
            ["bad punctuation ."],
            ["escape the period"]);

        verify(/\p{L}{7}/u,
            ["Siebentausenddreihundertzweiundzwanzig"],
            ["no", "threee small words"]);

        verify(/\b[^\We]+\b/iu,
            ["red platypus", "wobbling nest"],
            ["earth bed", "bedrøvet abe", "BEET"]);


        function verify(regexp, yes, no) {
            // Ignore unfinished exercises
            if (regexp.source == "...") return;

            for (let str of yes) {
                regexp.lastIndex = 0; // reset before each test
                if (!regexp.test(str)) {
                    console.log(`Failure to match '${str}'`);
                }
            }

            for (let str of no) {
                regexp.lastIndex = 0; // reset before each test
                if (regexp.test(str)) {
                    console.log(`Unexpected match for '${str}'`);
                }
            }
        }

        $p1.innerText += text1 + "Cf. the console.";
    </script>

    <!-- Exercice 3 -->
    <script>
        let $p3 = document.getElementById("ex-3");
        let text3 = "";

        // Fill in this regular expression.
        let number = /(^[+-]?\d(\d*|e[+-]\d+)(\.(\de\d|\d*))?$)|(^\.\d+$)/i;

        // Tests:
        for (let str of ["1", "-1", "+15", "1.55", ".5", "5.",
            "1.3e2", "1E-4", "1e+12"]) {
            if (!number.test(str)) {
                console.log(`Failed to match '${str}'`);
            }
        }
        for (let str of ["1a", "+-1", "1.2.3", "1+1", "1e4.5",
            ".5.", "1f5", "."]) {
            if (number.test(str)) {
                console.log(`Incorrectly accepted '${str}'`);
            }
        }

        $p3.innerText += text3 + "Cf. the console."; 
    </script>
