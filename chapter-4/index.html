    <h1>Chapter 4 Exercices</h1>
    <h2>Ex. 1: The Sum Of A Range</h2>

    <p id="ex-2"></p>

    <!-- Exercice 1 -->
    <script>
        let $p1 = document.getElementById("ex-1");
        let text1 = "";

        function range(start, end, step = 1) {
            let output = [];
            for (let i = start; step < 0 ? i >= end : i <= end; i = i + step) {
                output.push(i);
            }
            return output;
        }

        function sum(numbers) {
            let sum = 0;
            for (let number of numbers) {
                sum += number;
            }
            return sum;
        }

        text1 += sum(range(1, 10));
        text1 += "\n" + range(1, 10, 2);
        text1 += "\n" + range(5, 2, -1);

        $p1.innerText += text1;
    </script>

    <!-- Exercice 2 -->
    <script>
        let $p2 = document.getElementById("ex-2");
        let text2 = "";

        const reverseArray = (inputArray) => {
            let reversedArray = [];
            for (let item of inputArray) {
                reversedArray.unshift(item);
            }
            return reversedArray;
        };

        let reverseArrayInPlace = function (inputArray) {
            const arrayLength = inputArray.length;
            let tempArray = [];
            for (let i = 0; i < arrayLength; i++) {
                tempArray[i] = inputArray.pop();
            }
            for (let i = 0; i < arrayLength; i++) {
                inputArray.push(tempArray[i]);
            }
            return inputArray;
        };

        text2 += reverseArray([8, 0, 0, 8, 1, 3, 5]);
        text2 += "\n" + reverseArrayInPlace([1, 2, 3, 4, 5, 6]);

        $p2.innerText += text2;
    </script>

    <!-- Exercice 3 -->
    <script>
        let $p3 = document.getElementById("ex-3");
        let text3 = "";

        function arrayToList(inputArray) {
            let list = {};
            let curr = list;
            for (let item of inputArray) {
                curr.value = item;
                inputArray.indexOf(item) === (inputArray.length - 1) ? curr.rest = null : curr.rest = {};
                curr = curr.rest;
            }
            return list;
        }

        function listToArray(inputList) {
            let curr = inputList;
            let outputArray = [];
            while (curr !== null) {
                if (curr?.value === undefined) return outputArray;
                outputArray.push(curr.value);
                curr = curr.rest;
            }
            return outputArray;
        }

        function prepend(inputList, value) {
            return { value: value, rest: inputList };
        }

        function nth(inputList, index) {
            if (index === 0) {
                return inputList.value;
            } else if (inputList.rest === null) {
                return undefined;
            } else {
                return nth(inputList.rest, index - 1);
            }
        }

        arrayToListResult = arrayToList([6, 12, "A", "4th result", "5th result"]);
        console.log(arrayToListResult);
        listToArrayResult = listToArray(arrayToListResult);
        console.log(listToArrayResult);
        prependResult = prepend(arrayToListResult, "Start !");
        console.log(prependResult);
        nthResult = nth(prependResult, 1);
        console.log(nthResult);

        $p3.innerText += text3 + "Cf. the results in the console."; 
    </script>

    <!-- Exercice 4 -->
    <script>
        let $p4 = document.getElementById("ex-4");
        let text4 = "";

        const deepEqual = (a, b) => {
            let flag = true;

            function search(a, b) {
                if ((typeof a === "object" && a !== null) && (typeof b === "object" && b !== null)) {
                    if (Object.keys(a).length == Object.keys(b).length) {
                        for (let keyA of Object.keys(a)) {
                            if (keyA in b === false) {
                                return false;
                            }
                            flag = search(a[keyA], b[keyA]);
                            if (!flag) {
                                break;
                            }
                        }
                    } else {
                        return false;
                    }
                } else if (a !== b) {
                    return false;
                }

                return flag;
            }

            return search(a, b);
        };

        console.log("//// EXERCICE 4 ////")
        let obj = { here: { is: "an" }, object: 2 };
        console.log(deepEqual(obj, obj));
        // // // // // → true
        console.log("false ? " + deepEqual(obj, { here: 1, object: 2 }));
        // // // // // // → false
        console.log(deepEqual(obj, { here: { is: "an" }, object: 2 }));
        // // // → true
        console.log(deepEqual({ a: 1, b: 2 }, { a: 1, b: 2 }));
        // // // → true
        console.log("false ? " + deepEqual({ a: 1, b: 2 }, { a: 1, b: 3 }));
        // // // → false
        console.log(deepEqual({ a: 1, b: 2 }, { b: 2, a: 1 }));
        // // // → true
        console.log(deepEqual(
            { a: { b: 2 } },
            { a: { b: 2 } }
        ));
        // // // → true
        console.log("false ? " + deepEqual(
            { a: { b: 2 } },
            { a: { b: 3 } }
        ));
        // // // → false
        console.log(deepEqual(
            { a: { b: { c: 3 } } },
            { a: { b: { c: 3 } } }
        ));
        // // // → true
        console.log(deepEqual(
            { a: 1, b: { c: 2, d: 3 } },
            { a: 1, b: { c: 2, d: 3 } }
        ));
        // // // → true
        console.log("false ? " + deepEqual(
            { a: 1, b: { c: 2, d: 3 } },
            { a: 1, b: { c: 2 } }
        ));
        // // // → false
        console.log(deepEqual(
            { x: [{ y: 2 }, 3] },
            { x: [{ y: 2 }, 3] }
        ));
        // // // → true
        console.log("false ? " + deepEqual({ a: 1 }, { a: 1, b: 2 }));
        // false
        console.log("false ? " + deepEqual(
            { a: 1 },
            { a: 1, extra: 999 }
        ));
        // false
        console.log("false ? " + deepEqual({ a: undefined }, {}));
        // false
        console.log("false ? " + deepEqual({ a: 1 }, { x: 1 }));
        // false
        console.log("false ? " + deepEqual(
            { a: 1, b: 2 },
            { a: 999, b: 2 }
        ));
        // false
        console.log("false ? " + deepEqual(
            { a: 1, b: undefined },
            { a: 1, c: undefined }
        ));
        // false
        console.log("false ? " +
            deepEqual(
                { a: 999, b: 2 },
                { a: 1, b: 2 }
            )
        );
        console.log("false ? " +
            deepEqual(
                { a: { x: 1, y: 999 }, b: 2 },
                { a: { x: 1, y: 2 }, b: 2 }
            )
        );
        console.log("false ? " + 
            deepEqual(
                { a: { x: 1 } },
                { a: { x: 1, y: 2 } }
            )
        );

        $p4.innerText += text4 + "Cf. the results in the console.";
    </script>
