<!doctype html>

<div></div>
<script>
    // Picture
    var Picture = class Picture {
        constructor(width, height, pixels) {
            this.width = width;
            this.height = height;
            this.pixels = pixels;
        }
        static empty(width, height, color) {
            let pixels = new Array(width * height).fill(color);
            return new Picture(width, height, pixels);
        }
        pixel(x, y) {
            return this.pixels[x + y * this.width];
        }
        draw(pixels) {
            let copy = this.pixels.slice();
            for (let { x, y, color } of pixels) {
                copy[x + y * this.width] = color;
            }
            return new Picture(this.width, this.height, copy);
        }
    }

    // Utilities & Constants : updateState(), elt()
    function updateState(state, action) {
        return { ...state, ...action };
    }

    function elt(type, props, ...children) {
        let dom = document.createElement(type);
        if (props) Object.assign(dom, props);
        for (let child of children) {
            if (typeof child != "string") dom.appendChild(child);
            else dom.appendChild(document.createTextNode(child));
        }
        return dom;
    }

    var scale = 10;

    // Canvas/Picture Stuff
    // Ex. 2: Efficient Drawing
    var PictureCanvas = class PictureCanvas {
        constructor(picture, pointerDown) {
            this.dom = elt("canvas", {
                onmousedown: event => this.mouse(event, pointerDown),
                ontouchstart: event => this.touch(event, pointerDown)
            });
            this.syncState(picture);
        }
        syncState(picture) {
            if (this.picture == picture) return;
            this.picture = picture;
            drawPicture(this.picture, this.dom, scale);
        }
    }

    function drawPicture(picture, canvas, scale) {
        // Prevent the previous canvas from being deleted by scaling !
        if (canvas.width !== (picture.width * scale) && canvas.height !== picture.height * scale) {
            canvas.width = picture.width * scale;
            canvas.height = picture.height * scale;
        }
        let cx = canvas.getContext("2d");

        // Converting the 180 000 pixels raw image from the previously shown
        // canvas into the usable 1800 canvas scaled pixels.
        let imageExtract = extractPixelsFromCanvasContext(cx, canvas.width, canvas.height);
        let prevCanvasPixels = [];
        for (let i = 0; i < imageExtract.length; i = i + 10) {
            if ((i + canvas.width) % (canvas.width * 2) === 0) i += ((canvas.width * 10) - canvas.width);
            if (i === imageExtract.length) continue;
            prevCanvasPixels.push(imageExtract[i]);
        }

        for (let y = 0; y < picture.height; y++) {
            for (let x = 0; x < picture.width; x++) {
                if (picture.pixel(x, y) === prevCanvasPixels[x + y * picture.width]) {
                    // console.log("Skipped !", picture.pixel(x,y));
                    continue;
                }
                cx.fillStyle = picture.pixel(x, y);
                cx.fillRect(x * scale, y * scale, scale, scale);
            }
        }
    }

    // Canvas Interaction
    PictureCanvas.prototype.mouse = function (downEvent, onDown) {
        if (downEvent.button != 0) return;
        let pos = pointerPosition(downEvent, this.dom);
        let onMove = onDown(pos);
        if (!onMove) return;
        let move = moveEvent => {
            if (moveEvent.buttons == 0) {
                this.dom.removeEventListener("mousemove", move);
            } else {
                let newPos = pointerPosition(moveEvent, this.dom);
                if (newPos.x == pos.x && newPos.y == pos.y) return;
                pos = newPos;
                onMove(newPos);
            }
        };
        this.dom.addEventListener("mousemove", move);
    };

    function pointerPosition(pos, domNode) {
        let rect = domNode.getBoundingClientRect();
        return {
            x: Math.floor((pos.clientX - rect.left) / scale),
            y: Math.floor((pos.clientY - rect.top) / scale)
        };
    }

    PictureCanvas.prototype.touch = function (startEvent,
        onDown) {
        let pos = pointerPosition(startEvent.touches[0], this.dom);
        let onMove = onDown(pos);
        startEvent.preventDefault();
        if (!onMove) return;
        let move = moveEvent => {
            let newPos = pointerPosition(moveEvent.touches[0],
                this.dom);
            if (newPos.x == pos.x && newPos.y == pos.y) return;
            pos = newPos;
            onMove(newPos);
        };
        let end = () => {
            this.dom.removeEventListener("touchmove", move);
            this.dom.removeEventListener("touchend", end);
        };
        this.dom.addEventListener("touchmove", move);
        this.dom.addEventListener("touchend", end);
    };

    // App Object Class, Selecters
    // Ex. 1: Keyboard Bindings
    var PixelEditor = class PixelEditor {
        constructor(state, config) {
            let { tools, controls, dispatch } = config;
            this.state = state;

            this.canvas = new PictureCanvas(state.picture, pos => {
                let tool = tools[this.state.tool];
                let onMove = tool(pos, this.state, dispatch);
                if (onMove) return pos => onMove(pos, this.state);
            });

            this.controls = controls.map(
                Control => new Control(state, config));

            function handleKeyDown(event, config) {
                for (let toolName of Object.keys(config.tools)) {
                    if (event.key === "z" && (event.ctrlKey || event.metaKey)) { config.dispatch({ undo: true }); return; }
                    else if (event.key === toolName.slice(0, 1)) { config.dispatch({ tool: toolName }); return; }
                }
            }
            this.dom = elt("div",
                {
                    tabIndex: 0,
                    onkeydown: (event) => handleKeyDown(event, config),
                }
                , this.canvas.dom, elt("br"),
                ...this.controls.reduce(
                    (a, c) => a.concat(" ", c.dom), []));
        }

        syncState(state) {
            this.state = state;
            this.canvas.syncState(state.picture);
            for (let ctrl of this.controls) ctrl.syncState(state);
        }
    }

    var ToolSelect = class ToolSelect {
        constructor(state, { tools, dispatch }) {
            this.select = elt("select", {
                onchange: () => dispatch({ tool: this.select.value })
            }, ...Object.keys(tools).map(name => elt("option", {
                selected: name == state.tool
            }, name)));
            this.dom = elt("label", null, "🖌 Tool: ", this.select);
        }
        syncState(state) { this.select.value = state.tool; }
    }

    var ColorSelect = class ColorSelect {
        constructor(state, { dispatch }) {
            this.input = elt("input", {
                type: "color",
                value: state.color,
                onchange: () => dispatch({ color: this.input.value })
            });
            this.dom = elt("label", null, "🎨 Color: ", this.input);
        }
        syncState(state) { this.input.value = state.color; }
    }

    // Drawing Tools
    // Ex. 4: Proper Lines
    function distanceBetweenPoints(x1, y1, x2, y2) {
        return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
    }
    function checkIfPointsAreNeighbours(x1, y1, x2, y2) {
        if (distanceBetweenPoints(x1, y1, x2, y2) <= Math.sqrt(2)) return true;
        else return false;
    }
    function angleBetweenPoints(x1, y1, x2, y2) {
        let xDist = Math.abs(x2-x1);
        let yDist = Math.abs(y2-y1);
        let angle = Math.atan(yDist/xDist);
        return angle * (180/Math.PI);
    }
    function findLocalNearestPixel(xCurr, yCurr, xStart, yStart, xEnd, yEnd, state) {
        let searchArray = [];
        let angleBetweenStartAndEnd = angleBetweenPoints(xStart, yStart, xEnd, yEnd);
        for (let y = Math.max(0, yCurr - 1); y <= yCurr + 1; y++) {
            for (let x = Math.max(0, xCurr - 1); x <= xCurr + 1; x++) {
                searchArray.push({ x: x, y: y, distance: distanceBetweenPoints(x, y, xEnd, yEnd), angleBetweenEnd: angleBetweenPoints(x, y, xEnd, yEnd) });
            }
        }

        // Sort by distance, [0] is the closest, [1] the 2nd closest to the endPoint
        searchArray.sort((a, b) => {
            return a.distance - b.distance;
        });

        // If the 1st point has a closer angle to the starting angle, return it, otherwise return the 2nd closest point.
        let firstAngleDif = Math.abs(searchArray[0].angleBetweenEnd - angleBetweenStartAndEnd);
        let secondAngleDif = Math.abs(searchArray[1].angleBetweenEnd - angleBetweenStartAndEnd);
        let index = 0;
        if (secondAngleDif < firstAngleDif) index = 1;
        let result = { x: searchArray[index].x, y: searchArray[index].y, color: state.color };
        return result;
    }
    function getPixelsBetweenPoints(xStart, yStart, xEnd, yEnd, state) {
        let results = [];
        let xCurr = xStart, yCurr = yStart;
        while (Math.abs(xEnd - xCurr) > 1 || Math.abs(yEnd - yCurr) > 1) {
            let bestLocalPixel = findLocalNearestPixel(xCurr, yCurr, xStart, yStart, xEnd, yEnd, state);
            xCurr = bestLocalPixel.x;
            yCurr = bestLocalPixel.y;
            results.push(bestLocalPixel);
        }
        return results;
    }
    function draw(pos, state, dispatch) {
        let previousPos = { x: pos.x, y: pos.y };
        function drawPixel({ x, y }, state) {
            let drawn = [{ x, y, color: state.color }];
            if (!checkIfPointsAreNeighbours(previousPos.x, previousPos.y, x, y)) drawn = drawn.concat(getPixelsBetweenPoints(previousPos.x, previousPos.y, x, y, state));
            dispatch({ picture: state.picture.draw(drawn) });
            previousPos = Object.assign(previousPos, { x: x, y: y });
        }
        drawPixel(pos, state);
        return drawPixel;
    }

    function line(start, state, dispatch) {
        function drawLine(pos) {
            let drawn = [{ x: start.x, y: start.y, color: state.color }, {x: pos.x, y: pos.y, color: state.color}];
            drawn = drawn.concat(getPixelsBetweenPoints(start.x, start.y, pos.x, pos.y, state));
            dispatch({picture: state.picture.draw(drawn)});
        }
        drawLine(start);
        return drawLine;
    }

    function rectangle(start, state, dispatch) {
        function drawRectangle(pos) {
            let xStart = Math.min(start.x, pos.x);
            let yStart = Math.min(start.y, pos.y);
            let xEnd = Math.max(start.x, pos.x);
            let yEnd = Math.max(start.y, pos.y);
            let drawn = [];
            for (let y = yStart; y <= yEnd; y++) {
                for (let x = xStart; x <= xEnd; x++) {
                    drawn.push({ x, y, color: state.color });
                }
            }
            dispatch({ picture: state.picture.draw(drawn) });
        }
        drawRectangle(start);
        return drawRectangle;
    }

    var around = [{ dx: -1, dy: 0 }, { dx: 1, dy: 0 },
    { dx: 0, dy: -1 }, { dx: 0, dy: 1 }];

    function fill({ x, y }, state, dispatch) {
        let targetColor = state.picture.pixel(x, y);
        let drawn = [{ x, y, color: state.color }];
        let visited = new Set();
        for (let done = 0; done < drawn.length; done++) {
            for (let { dx, dy } of around) {
                let x = drawn[done].x + dx, y = drawn[done].y + dy;
                if (x >= 0 && x < state.picture.width &&
                    y >= 0 && y < state.picture.height &&
                    !visited.has(x + "," + y) &&
                    state.picture.pixel(x, y) == targetColor) {
                    drawn.push({ x, y, color: state.color });
                    visited.add(x + "," + y);
                }
            }
        }
        dispatch({ picture: state.picture.draw(drawn) });
    }

    function pick(pos, state, dispatch) {
        dispatch({ color: state.picture.pixel(pos.x, pos.y) });
    }

    // Ex. 3: Circles
    function circle(pos, state, dispatch) {
        let start = pos;
        function checkIfPointInCircle(radius, centerPos, pointPos) {
            let xDist = Math.abs(centerPos.x - pointPos.x);
            let yDist = Math.abs(centerPos.y - pointPos.y);
            if (Math.sqrt(xDist ** 2 + yDist ** 2) <= radius) return true;
            else return false;
        }

        function drawCircle(pos) {
            let pixArray = [];
            let radius = Math.sqrt(Math.abs(pos.x - start.x) ** 2 + Math.abs(pos.y - start.y) ** 2);
            for (let y = Math.min(0, Math.abs(pos.y - radius)); y <= Math.min(state.picture.height, start.y + radius) && y != state.picture.height; y++) {
                for (let x = Math.min(0, Math.abs(pos.x - radius)); x <= Math.min(state.picture.width, start.x + radius) && x != state.picture.width; x++) {
                    if (checkIfPointInCircle(radius, start, { x, y })) pixArray.push({ x, y, color: state.color });
                }
            }
            dispatch({ picture: state.picture.draw(pixArray) });
        }

        drawCircle(start);
        return drawCircle;
    }

    // Saving
    var SaveButton = class SaveButton {
        constructor(state) {
            this.picture = state.picture;
            this.dom = elt("button", {
                onclick: () => this.save()
            }, "💾 Save");
        }
        save() {
            let canvas = elt("canvas");
            drawPicture(this.picture, canvas, 1);
            let link = elt("a", {
                href: canvas.toDataURL(),
                download: "pixelart.png"
            });
            document.body.appendChild(link);
            link.click();
            link.remove();
        }
        syncState(state) { this.picture = state.picture; }
    }

    // Loading
    var LoadButton = class LoadButton {
        constructor(_, { dispatch }) {
            this.dom = elt("button", {
                onclick: () => startLoad(dispatch)
            }, "📁 Load");
        }
        syncState() { }
    }

    function startLoad(dispatch) {
        let input = elt("input", {
            type: "file",
            onchange: () => finishLoad(input.files[0], dispatch)
        });
        document.body.appendChild(input);
        input.click();
        input.remove();
    }

    function finishLoad(file, dispatch) {
        if (file == null) return;
        let reader = new FileReader();
        reader.addEventListener("load", () => {
            let image = elt("img", {
                onload: () => dispatch({
                    picture: pictureFromImage(image)
                }),
                src: reader.result
            });
        });
        reader.readAsDataURL(file);
    }

    function extractPixelsFromCanvasContext(context, width, height) {
        let pixels = []
        let { data } = context.getImageData(0, 0, width, height);

        function hex(n) {
            return n.toString(16).padStart(2, "0");
        }
        for (let i = 0; i < data.length; i += 4) {
            let [r, g, b] = data.slice(i, i + 3);
            pixels.push("#" + hex(r) + hex(g) + hex(b));
        }
        return pixels;
    }
    function pictureFromImage(image) {
        let width = Math.min(100, image.width);
        let height = Math.min(100, image.height);
        let canvas = elt("canvas", { width, height });
        let cx = canvas.getContext("2d");
        cx.drawImage(image, 0, 0);
        let pixels = extractPixelsFromCanvasContext(cx, width, height);

        return new Picture(width, height, pixels);
    }

    // Undo
    function historyUpdateState(state, action) {
        if (action.undo == true) {
            if (state.done.length == 0) return state;
            return {
                ...state,
                picture: state.done[0],
                done: state.done.slice(1),
                doneAt: 0
            };
        } else if (action.picture &&
            state.doneAt < Date.now() - 1000) {
            return {
                ...state,
                ...action,
                done: [state.picture, ...state.done],
                doneAt: Date.now()
            };
        } else {
            return { ...state, ...action };
        }
    }

    var UndoButton = class UndoButton {
        constructor(state, { dispatch }) {
            this.dom = elt("button", {
                onclick: () => dispatch({ undo: true }),
                disabled: state.done.length == 0
            }, "⮪ Undo");
        }
        syncState(state) {
            this.dom.disabled = state.done.length == 0;
        }
    }


    // 
    // 
    // Initializing a drawing app
    var startState = {
        tool: "draw",
        color: "#000000",
        picture: Picture.empty(60, 30, "#f0f0f0"),
        done: [],
        doneAt: 0
    };

    var baseTools = { draw, fill, rectangle, pick, circle, line };

    var baseControls = [
        ToolSelect, ColorSelect, SaveButton, LoadButton, UndoButton
    ];

    function startPixelEditor({ state = startState,
        tools = baseTools,
        controls = baseControls }) {
        let app = new PixelEditor(state, {
            tools,
            controls,
            dispatch(action) {
                state = historyUpdateState(state, action);
                app.syncState(state);
            }
        });
        return app.dom;
    }


    // Inserting the drawing app into the DOM
    document.querySelector("div")
        .appendChild(startPixelEditor({}));
</script>
