<!doctype html>

<style>
    body {
        min-height: 200px
    }
</style>

<img src="img/cat.png" id="cat" style="position: absolute">
<img src="img/hat.png" id="hat" style="position: absolute">

<script>
    let cat = document.querySelector("#cat");
    let hat = document.querySelector("#hat");

    let angle = 0;
    let lastTime = null;
    function animate(time) {
        if (lastTime != null) angle += (time - lastTime) * 0.001;
        lastTime = time;
        cat.style.top = (Math.sin(angle) * 40 + 100) + "px";
        cat.style.left = (Math.cos(angle) * 200 + 300) + "px";

        // Opposite Side Orbit
        // hat.style.top = (Math.sin(angle -Math.PI) * 40 + 40) + "px";
        // hat.style.left = (Math.cos(angle - Math.PI) * 200 + 230) + "px";

        // Hat Orbits the Cat
        hat.style.top = ((cat.getBoundingClientRect().y) + (Math.sin(angle*4) * 40)) + "px";
        hat.style.left = ((cat.getBoundingClientRect().x) + (Math.cos(angle*4) * 40)) + "px";

        requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
</script>
