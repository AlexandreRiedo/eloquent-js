<!DOCTYPE html>
<html>

<body>
    <h1>Chapter 6 Exercices</h1>
    <h2>Ex. 1: A Vector Type</h2>
    <p id="ex-1"></p>

    <h2>Ex. 2: Groups</h2>
    <p id="ex-2"></p>

    <h2>Ex. 3: Iterable Groups</h2>
    <p id="ex-3"></p>

    <!-- Exercice 1 -->
    <script>
        let $p1 = document.getElementById("ex-1");
        let text1 = "";

        class Vec {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }

            plus(otherVector) {
                return new Vec(this.x + otherVector.x, this.y + otherVector.y)
            }

            minus(otherVector) {
                return new Vec(this.x - otherVector.x, this.y - otherVector.y)
            }

            get length() {
                return Math.sqrt(this.x ** 2 + this.y ** 2)
            }
        }

        console.log(new Vec(1, 2).plus(new Vec(2, 3)));
        // → Vec{x: 3, y: 5}
        console.log(new Vec(1, 2).minus(new Vec(2, 3)));
        // // → Vec{x: -1, y: -1}
        console.log(new Vec(3, 4).length);
        // → 5

        $p1.innerText += text1 + "Cf. the console.";
    </script>

    <!-- Exercice 2 -->
    <script>
        let $p2 = document.getElementById("ex-2");
        let text2 = "";

        class Group {
            constructor() {
                this.data = {};
            }

            has(value) {
                return (value in this.data);
            }

            add(value) {
                if (!this.has(value)) {
                    this.data[value] = value;
                    console.log("Added " + this.data[value]);
                } else {
                    console.log("Nothing added...")
                }
            }

            delete(value) {
                if (this.has(value)) {
                    console.log("Removed " + this.data[value]);
                    delete this.data[value];
                } else {
                    console.log("Nothing removed...")
                }
            }

            static from(collection) {
                let newGroup = new Group();
                for (let item of collection) {
                    newGroup.data[item] = item;
                }
                return newGroup;
            }

            [Symbol.iterator]() {
                return new GroupIterator(this);
            }

        }

        let groupTest = Group.from([10, 20]);
        console.log(groupTest.has(10));
        // → true
        console.log(groupTest.has(30));
        // // → false
        groupTest.add(5);
        groupTest.add(10);
        groupTest.delete(10);
        groupTest.delete(10);
        console.log(groupTest.has(10));
        // → false

        $p2.innerText += text2 + "Cf. the console.";
    </script>

    <!-- Exercice 3 -->
    <script>
        let $p3 = document.getElementById("ex-3");
        let text3 = "";

        class GroupIterator {
            constructor(group) {
                this.group = group;
            }
            
            next() {
                if (Object.keys(this.group.data).length === 0) {
                    return {done: true};
                }
                let items = Object.keys(this.group.data);
                let value = items[0];
                delete this.group.data[items[0]];
                return {value, done : false};
            }
        }

        for (let value of Group.from(["yeahh", 13, -12, "f", "a", 2, 4, "d", "b"])) {
            console.log(value);
        }

        $p3.innerText += text3 + "Cf. the console."; 
    </script>

</body>
